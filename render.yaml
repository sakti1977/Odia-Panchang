# Free-tier friendly blueprint.
# Daily tweets: prefer GitHub Actions (.github/workflows/daily-tweet.yml)
# rather than a paid/always-on Render Cron + in-process APScheduler.
#
# Do NOT set ENABLE_INPROCESS_SCHEDULER on free web — the dyno sleeps.
# Put TWITTER_* on the web service so POST /tweet/post can publish.

services:
  - type: web
    name: odia-panjika-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /api
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./data/panchang.db
      - key: LOCATION_NAME
        value: Bhubaneswar
      - key: LOCATION_LAT
        value: "20.2961"
      - key: LOCATION_LON
        value: "85.8245"
      - key: LOCATION_TZ
        value: "5.5"
      - key: PUBLIC_API_URL
        value: https://odia-panchang.onrender.com
      # Free-tier default: scheduler off (GitHub Actions posts tweets)
      - key: ENABLE_INPROCESS_SCHEDULER
        value: "false"
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWITTER_API_KEY
        sync: false
      - key: TWITTER_API_SECRET
        sync: false
      - key: TWITTER_ACCESS_TOKEN
        sync: false
      - key: TWITTER_ACCESS_SECRET
        sync: false
      - key: TWITTER_BEARER_TOKEN
        sync: false
      # Required for POST /tweet/post and /social/post (Bearer / X-Tweet-Cron-Secret)
      - key: TWEET_CRON_SECRET
        sync: false
      # Meta Graph API — Facebook Page + Instagram Business
      - key: META_PAGE_ID
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_IG_USER_ID
        sync: false
      - key: META_GRAPH_VERSION
        value: "v21.0"

# Optional: if you later pay for always-on + Render Cron, uncomment and set secrets.

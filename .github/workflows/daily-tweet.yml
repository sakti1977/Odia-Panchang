name: Daily Odia Panjika

# Runs in GitHub Actions. Does not call Render.
# Meta secrets live in this repo (Settings → Secrets → Actions).

on:
  schedule:
    # GitHub deprioritizes runs scheduled on the hour/half-hour (everyone
    # picks those minutes) — observed drift on :00/:30 crons has been
    # 2-4 hours late. Odd minutes get scheduled far more reliably.
    # Primary: 05:17 IST = 23:47 UTC previous calendar day.
    - cron: "47 23 * * *"
    # Catch-up runs. Harmless if the primary already posted: the workflow's
    # own cache check skips instantly, and a Facebook retry is separately
    # guarded by the caption-fingerprint check in src/meta_poster.py. Only
    # fires real work when the primary run failed outright (e.g. an
    # expired token) and nothing was actually posted yet.
    - cron: "47 1 * * *"   # 07:17 IST catch-up
    - cron: "47 3 * * *"   # 09:17 IST catch-up
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Dry run only (do not publish to Facebook/Instagram)"
        required: false
        type: boolean
        default: false
      date:
        description: "Override date YYYY-MM-DD (leave empty for IST today)"
        required: false
        default: ""

concurrency:
  group: daily-panjika
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  daily-social:
    name: Post Facebook + Instagram
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Optional: a free ntfy.sh topic (https://ntfy.sh) so a failure
      # reaches your phone instead of only a GitHub issue. Set the
      # NTFY_TOPIC secret to enable; every step below is a no-op without it.
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-social.txt

      - name: Install Odia fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-lohit-orya fonts-noto-core

      - name: Install posting dependencies
        run: pip install -r requirements-social.txt

      - name: Compute today's date key (IST)
        id: datekey
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE="${{ github.event.inputs.date }}"
          else
            DATE=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Check whether today was already posted
        id: cache-restore
        if: github.event.inputs.test_mode != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .state/posted.marker
          key: panjika-posted-${{ steps.datekey.outputs.date }}

      - name: Skip notice
        if: steps.cache-restore.outputs.cache-hit == 'true'
        run: echo "Already posted ${{ steps.datekey.outputs.date }} IST — skipping. Re-run as a dry run to preview."

      - name: Post Facebook + Instagram
        if: steps.cache-restore.outputs.cache-hit != 'true'
        env:
          TEST_MODE: ${{ github.event.inputs.test_mode }}
          PANJIKA_DATE: ${{ steps.datekey.outputs.date }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          INSTAGRAM_AS_STORY: "true"
        run: python scripts/post_daily.py

      - name: Save posted-day marker to cache
        if: steps.cache-restore.outputs.cache-hit != 'true' && github.event.inputs.test_mode != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: .state/posted.marker
          key: panjika-posted-${{ steps.datekey.outputs.date }}

      - name: File/update failure alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="The scheduled Odia panjika Facebook/Instagram post failed. See the run log: $RUN_URL"
          gh label create bot-failure --color B60205 --description "Daily panjika post failed" 2>/dev/null || true
          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --label bot-failure --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "🔴 Daily panjika post failed" \
              --label bot-failure --body "$BODY"
          fi

      - name: Push alert (ntfy.sh)
        if: failure() && env.NTFY_TOPIC != ''
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s \
            -H "Title: Odia Panjika post failed" \
            -H "Priority: high" \
            -H "Tags: rotating_light" \
            -d "Daily Facebook/Instagram post failed for ${{ steps.datekey.outputs.date }}. $RUN_URL" \
            "https://ntfy.sh/$NTFY_TOPIC" || true

      - name: Close failure alert issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for num in $(gh issue list --repo "${{ github.repository }}" \
              --label bot-failure --state open --json number --jq '.[].number'); do
            gh issue comment "$num" --repo "${{ github.repository }}" \
              --body "✅ Resolved — today's panjika posted successfully."
            gh issue close "$num" --repo "${{ github.repository }}"
          done

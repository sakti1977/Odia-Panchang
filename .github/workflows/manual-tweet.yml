name: Manual Tweet Trigger

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Base URL of the Odia Panchang API"
        required: false
        default: "https://odia-panchang.onrender.com"

jobs:
  trigger-tweet:
    name: Wake + tweet
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wake + post
        env:
          PUBLIC_API_URL: ${{ github.event.inputs.api_url }}
          TWEET_CRON_SECRET: ${{ secrets.TWEET_CRON_SECRET }}
        run: |
          python scripts/free_tier_ops.py wake --url "$PUBLIC_API_URL"
          python scripts/free_tier_ops.py tweet --url "$PUBLIC_API_URL" --no-wake
      - name: Preview
        if: always()
        env:
          PUBLIC_API_URL: ${{ github.event.inputs.api_url }}
        run: python scripts/free_tier_ops.py health --url "$PUBLIC_API_URL"

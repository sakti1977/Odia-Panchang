name: Keep-warm free Render (disabled)

# Disabled. Daily panjika posting now runs inside GitHub Actions and does
# not need a Render web service. A 12-minute ping was keeping Render billed.
#
# Do not re-enable this unless you deliberately host the FastAPI site again.

on:
  workflow_dispatch:

jobs:
  ping:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "keep-warm is disabled"
